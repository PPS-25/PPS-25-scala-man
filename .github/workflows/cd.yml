name: Project Delivery

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: project-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-fat-jar:
    name: Build fat JAR (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Compile and test
        if: matrix.platform == 'linux'
        run: sbt -v compile test

      - name: Build fat JAR
        run: sbt -v "-Ddelivery.platform=${{ matrix.platform }}" assembly

      - name: Verify Linux fat JAR starts
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          jar=$(find target -path '*/scala-man-*-linux-fat.jar' -print -quit)
          test -n "$jar"

          # The JavaFX event loop is expected to keep running. `timeout` returning
          # 124 is therefore the success condition; every other status exposes the
          # JVM/JavaFX error in this job's log and stops publication.
          set +e
          timeout 15s xvfb-run -a java -jar "$jar"
          status=$?
          set -e

          if [ "$status" -ne 124 ]; then
            echo "Fat JAR stopped before the JavaFX application was running (exit $status)." >&2
            exit "$status"
          fi

      - name: Upload platform fat JAR
        uses: actions/upload-artifact@v4
        with:
          name: fat-jar-${{ matrix.platform }}
          path: target/scala-3.3.5/scala-man-0.1.0-SNAPSHOT-${{ matrix.platform }}-fat.jar
          if-no-files-found: error

  delivery:
    name: Project Delivery
    runs-on: ubuntu-latest
    needs: build-fat-jar
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Download platform fat JARs
        uses: actions/download-artifact@v4
        with:
          pattern: fat-jar-*
          path: fat-jars
          merge-multiple: true

      - name: Build report PDF
        run: >
          docker run --rm
          -v "${PWD}:/repo"
          -w /repo/report
          ghcr.io/xu-cheng/texlive-full:latest
          latexmk
          -pdf
          -interaction=nonstopmode
          -halt-on-error
          -file-line-error
          -jobname=report
          -outdir=../build
          main.tex

      - name: Build report PDF and package delivery
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import zipfile

          archive = Path("PPS-25-scala-man.zip")
          staging = Path("delivery-package")
          report_pdf = Path("build/report.pdf")

          if staging.exists():
              shutil.rmtree(staging)
          if archive.exists():
              archive.unlink()

          staging.mkdir()
          shutil.copytree("src", staging / "src")

          jars = sorted(Path("fat-jars").glob("scala-man-*-fat.jar"))
          for jar in jars:
              shutil.copy2(jar, staging / jar.name)
          shutil.copy2(report_pdf, staging / "report.pdf")

          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              zf.write(staging / "report.pdf", "report.pdf")
              for jar in jars:
                  zf.write(staging / jar.name, jar.name)
              for path in (staging / "src").rglob("*"):
                  if path.is_file():
                      zf.write(path, path.relative_to(staging).as_posix())

          with zipfile.ZipFile(archive) as zf:
              names = [name.rstrip("/") for name in zf.namelist() if name and not name.endswith("/")]

          root_files = sorted(name for name in names if "/" not in name)

          errors = []
          jar_files = [name for name in root_files if name.endswith(".jar")]
          report_files = [name for name in root_files if name == "report.pdf"]
          other_root_files = [name for name in root_files if name not in {"report.pdf"} and not name.endswith(".jar")]

          if sorted({name.split("/", 1)[0] for name in names if "/" in name}) != ["src"]:
              errors.append("expected the only root directory to be src")
          expected_jars = [
              "scala-man-0.1.0-SNAPSHOT-linux-fat.jar",
              "scala-man-0.1.0-SNAPSHOT-macos-fat.jar",
              "scala-man-0.1.0-SNAPSHOT-windows-fat.jar",
          ]
          if jar_files != expected_jars:
              errors.append(f"expected platform fat jars {expected_jars}, found {jar_files}")
          if len(report_files) != 1:
              errors.append(f"expected exactly one root report pdf, found {report_files}")
          if other_root_files:
              errors.append(f"unexpected root files: {other_root_files}")

          if errors:
              raise SystemExit("; ".join(errors))
          PY

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PPS-25-scala-man
          make_latest: true
          generate_release_notes: false
          files: |
            PPS-25-scala-man.zip
